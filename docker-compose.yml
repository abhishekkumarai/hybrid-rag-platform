# Full stack for the Hybrid RAG Platform.
#
#   docker compose up -d                        # infra + app services (Ollama on the host)
#   docker compose --profile local-llm up -d    # additionally run Ollama in a container (needs GPU passthrough)
#
# By default the app services reach Ollama on the host via host.docker.internal, which keeps an
# existing GPU-accelerated Ollama install working untouched. See OLLAMA_BASE_URL below.
#
# Postgres is NOT containerized here — this host already runs a native PostgreSQL 16 service on
# 5432 (used by other local projects too), so app services and Langflow reach it via
# host.docker.internal:5432 / database `rag_db`, same as Ollama above. POSTGRES_DB/POSTGRES_USER
# are pinned (not ${VAR:-default}) rather than read from the shell: this host also exports
# POSTGRES_DB/POSTGRES_USER for an unrelated project, and letting compose substitution pick those
# up here previously created a stray, wrongly-named database inside the (now-removed) postgres
# container. POSTGRES_PASSWORD still comes from the shell env, which already holds the correct
# local Postgres password.

x-app-env: &app-env
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  REDIS_HOST: redis
  REDIS_PORT: 6379
  POSTGRES_HOST: host.docker.internal
  POSTGRES_PORT: 5432
  POSTGRES_DB: rag_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to your local Postgres password (already exported system-wide on this host)}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  RAG_PROFILE: ${RAG_PROFILE:-quality}
  PYTHONPATH: /app

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: hybrid-rag-platform:local
  restart: unless-stopped
  environment: *app-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./configs:/app/configs
    - ./services:/app/services
    - ./contracts:/app/contracts
    - ./components:/app/components
    - ./tests:/app/tests
    - ./ui:/app/ui
  depends_on:
    qdrant:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Opt-in: `docker compose --profile local-llm up -d`.
  # Requires NVIDIA Container Toolkit; on Windows that means running Docker under WSL2.
  # Models are stored in the ollama_models volume and must be pulled into it, e.g.
  #   docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------- application
  gateway:
    <<: *app-base
    container_name: rag_gateway
    command: ["python", "-m", "uvicorn", "services.gateway.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${GATEWAY_HOST_PORT:-8001}:8000"
    # Importing the parser and reranker stack takes ~90s on first boot, and /api/v1/health probes
    # Qdrant, Redis and Ollama in series, so keep the start period and timeout generous — a tighter
    # setting reports the gateway unhealthy while it is still coming up normally.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  worker:
    <<: *app-base
    container_name: rag_worker
    command: ["python", "-m", "services.scheduler.worker"]

  scheduler:
    <<: *app-base
    container_name: rag_scheduler
    command: ["python", "-m", "services.scheduler.reconciler"]

  langflow:
    build:
      context: .
      dockerfile: docker/langflow.Dockerfile
    image: hybrid-rag-langflow:local
    container_name: rag_langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-admin}
      LANGFLOW_COMPONENTS_PATH: /app/components
      LANGFLOW_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to your local Postgres password (already exported system-wide on this host)}@host.docker.internal:5432/rag_db
      # Deployment-level DB provider for Langflow's Knowledge Bases feature (Settings > DB
      # Providers > Postgres) — a single env var read directly by PostgresBackend, distinct from
      # LANGFLOW_DATABASE_URL above (Langflow's own app metadata). Uses its own database,
      # `langflow_vectors`, on the same host Postgres instance, kept separate from `rag_db` so KB
      # embedding tables never collide with the app's own data. The `vector` extension must be
      # enabled on `langflow_vectors` by a superuser (`CREATE EXTENSION vector;`) before a
      # Postgres-backend Knowledge Base can be created — Langflow verifies it but never installs it.
      PGVECTOR_CONNECTION_STRING: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to your local Postgres password (already exported system-wide on this host)}@host.docker.internal:5432/langflow_vectors
      # The Ollama model component in the flow reaches the host's Ollama via host.docker.internal
      # (localhost/127.0.0.1 inside this container means the container itself, not the host).
      # Langflow's built-in SSRF guard blocks outbound requests to hosts not on this allowlist.
      LANGFLOW_SSRF_ALLOWED_HOSTS: host.docker.internal,localhost,127.0.0.1
    volumes:
      - ./components:/app/components
      - ./flows:/app/flows
      - ./data/langflow_data:/root/.langflow
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_models:
