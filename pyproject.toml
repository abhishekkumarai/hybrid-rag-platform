[project]
name = "hybrid-rag-platform"
version = "0.1.0"
description = "Modern 100% Open-Source Hybrid RAG Platform (SOA + Langflow)"
readme = "architecture_plan.md"
requires-python = ">=3.11"
authors = [{ name = "AI Engineering Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.4",
    "pymupdf>=1.24.2",
    "qdrant-client>=1.9.1",
    "bm25s>=0.2.0",
    "flashrank>=0.2.8",
]

[project.optional-dependencies]
parse = [
    "docling>=1.0.0",
    "rapidocr-onnxruntime>=1.3.8",
    "pillow>=10.0.0",
]
ui = [
    "langflow>=1.0.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
